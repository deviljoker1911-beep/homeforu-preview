<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the app draw under the notch (safe-area insets); no maximum-scale: pinch zoom stays available -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HomeforU</title>
    <!-- the public site owns the canonical pages: this app is never indexed -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeforU" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- the Latin Inter file is asked for by the first screen: starting it with the page (instead of after the 800 KB script has run) takes it off the critical path (PERF-01) -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- the logo as an SVG (sharp at any tab size), then the .ico for the browsers that do not take one; both are made by scripts/generate-brand-assets.mjs -->
    <link rel="icon" href="/icons/mark.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      The preview of a shared link (a chat, a mail). The image address is a path on this origin: a crawler that wants an absolute address will not show it.
      The page itself stays out of search engines (the robots tag above); the public site owns the canonical pages.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HomeforU" />
    <meta property="og:title" content="HomeforU" />
    <meta property="og:description" content="Homes to buy and rent in India." />
    <meta property="og:image" content="/icons/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The HomeforU logo: a violet tile with a white house and a gold U." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icons/og-image.png" />
    <!-- The react-native-web recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!--
      Before any JavaScript: the page background of the chosen mode (no white flash), the focus ring of the elements react-native-web
      renders as div[tabindex], the two Inter files (the Latin letters and the rupee sign) for devices without the system font.
      The colours are the bg / ink / focus tokens of design/tokens.json (a test pins them).
    -->
    <style id="hfu-shell">
      :root {
        --hfu-pre-bg: #000000;
        --hfu-pre-fg: #FFFFFF;
        --hfu-pre-focus: #C6FF3D;
        --font-inter: 'HFU Inter';
        --font-inter-rupee: 'HFU Inter Rupee';
      }
      @media (prefers-color-scheme: light) {
        :root:not([data-hfu-theme="dark"]) { --hfu-pre-bg: #EDEFF5; --hfu-pre-fg: #000000; --hfu-pre-focus: #000000; }
        :root:not([data-hfu-theme="dark"]):not([data-hfu-glass="on"]) { --hfu-pre-bg: #F2F2F7; }
      }
      :root[data-hfu-theme="dark"] { --hfu-pre-bg: #000000; --hfu-pre-fg: #FFFFFF; --hfu-pre-focus: #C6FF3D; }
      :root[data-hfu-theme="light"] { --hfu-pre-bg: #EDEFF5; --hfu-pre-fg: #000000; --hfu-pre-focus: #000000; }
      :root[data-hfu-theme="light"]:not([data-hfu-glass="on"]) { --hfu-pre-bg: #F2F2F7; }
      html, body { background: var(--hfu-pre-bg); }
      body { margin: 0; color: var(--hfu-pre-fg); -webkit-text-size-adjust: 100%; }
      [tabindex]:focus-visible { outline: 2px solid var(--hfu-pre-focus); outline-offset: 2px; }
      /* a row of a group that clips its content (ListGroup): a ring outside would show as two stray lines, so it is drawn inside */
      [tabindex][data-hfu-focus-inset]:focus-visible { outline-offset: -2px; }
      /* Light: the ring is black, which nearly disappears on a dark photograph or scrim (1.5:1). A white band next to it makes the ring two-tone, so it reads on a light page and on a dark photo (A11Y-14).
         The band is the box-shadow of the focused element (important: react-native-web writes box-shadow inline), outside the element, or inside for a row that clips. Dark keeps its lime ring alone. */
      @media (prefers-color-scheme: light) {
        :root:not([data-hfu-theme="dark"]) [tabindex]:focus-visible { box-shadow: 0 0 0 2px #FFFFFF !important; }
        :root:not([data-hfu-theme="dark"]) [tabindex][data-hfu-focus-inset]:focus-visible { box-shadow: inset 0 0 0 4px #FFFFFF !important; }
      }
      :root[data-hfu-theme="light"] [tabindex]:focus-visible { box-shadow: 0 0 0 2px #FFFFFF !important; }
      :root[data-hfu-theme="light"] [tabindex][data-hfu-focus-inset]:focus-visible { box-shadow: inset 0 0 0 4px #FFFFFF !important; }
      /* react-native-web has no hitSlop: a small control (PressableScale, Toggle, Checkbox, Segmented) gets an invisible target of at least 44 x 44 around its centre.
         z-index -1 puts it UNDER what is inside the control (every react-native-web view is its own stacking context): drawn on top, as a plain absolute box, it took the click
         of a heart that sits on a card and left the heart dead. */
      [data-hfu-hit]::after { content: ''; position: absolute; z-index: -1; top: 50%; left: 50%; width: 100%; height: 100%; min-width: 44px; min-height: 44px; transform: translate(-50%, -50%); }
      noscript { display: block; padding: 24px; font: 16px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      /* The launch screen (PERF-01): the first paint no longer waits for the 800 KB script. It covers the empty root with the logo on the page colour; features/shell/launchShell.ts
         fades it out when the app has its first screen. If the script never runs it gives way by itself after 30 s, so a failed load is not an endless logo. */
      #hfu-launch { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; background: var(--hfu-pre-bg); transition: opacity 250ms ease; animation: hfu-launch-out 200ms ease 30s forwards; }
      #hfu-launch[data-done] { opacity: 0; pointer-events: none; }
      #hfu-launch img { width: 88px; height: 88px; animation: hfu-launch-pulse 1600ms ease-in-out infinite; }
      @keyframes hfu-launch-pulse { 0%, 100% { opacity: .7; transform: scale(.97); } 50% { opacity: 1; transform: scale(1); } }
      @keyframes hfu-launch-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #hfu-launch { transition: none; } #hfu-launch img { animation: none; } }
      @font-face {
        font-family: 'HFU Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-latin-wght-normal.woff2) format('woff2');
      }
      @font-face {
        font-family: 'HFU Inter Rupee';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url(/fonts/inter-rupee-wght-normal.woff2) format('woff2');
        unicode-range: U+20B9;
      }
    </style>
    <!--
      The appearance script: applies the saved choice before the first paint. Keys and attributes are the ones of the site and of the
      native app: hfu-theme (dark | light; absent = follow the OS), hfu-glass (on | off; absent = ON in this app), hfu-motion (1 to 10).
      Glass turns itself off when the OS asks for less transparency or more contrast. It is constant text (a test pins it), so its
      SHA-256 can go into a future script-src.
    -->
    <script id="hfu-appearance">
      (function () {
        function read(key) { try { return localStorage.getItem(key) } catch (e) { return null } }
        try {
          var d = document.documentElement, t = read('hfu-theme'), g = read('hfu-glass'), m = read('hfu-motion')
          if (t === 'dark' || t === 'light') {
            d.setAttribute('data-hfu-theme', t)
            var c = document.querySelectorAll('meta[name="theme-color"]'), v = t === 'dark' ? '#000000' : '#F2F2F7'
            for (var i = 0; i < c.length; i++) { c[i].setAttribute('content', v); c[i].removeAttribute('media') }
          }
          var less = matchMedia('(prefers-reduced-transparency: reduce)').matches || matchMedia('(prefers-contrast: more)').matches
          if (g !== 'off' && !less) d.setAttribute('data-hfu-glass', 'on')
          if (/^([1-9]|10)$/.test(m || '')) d.setAttribute('data-hfu-motion', m)
        } catch (e) {}
      })()
    </script>
  <meta name="theme-color" content="#000000">
</head>

  <body>
    <!-- shown until the app has its first screen (features/shell/launchShell.ts removes it); decorative, so it is hidden from assistive technology -->
    <div id="hfu-launch" aria-hidden="true"><img src="/icons/mark.svg" width="88" height="88" alt="" /></div>
    <noscript><style>#hfu-launch { display: none; }</style>HomeforU needs JavaScript to run. HomeforU a besoin de JavaScript pour fonctionner.</noscript>
    <!-- The root element of the app. -->
    <div id="root"></div>
  <script src="/_expo/static/js/web/entry-91c5d60163e000e0c1ad7930b4dcaea7.js" defer></script>
</body>
</html>
